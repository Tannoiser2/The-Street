# Pubblica la plancia giocabile su GitHub Pages.
#
# Ricostruisce tutto da zero a ogni push su main: grafica estratta dai PDF in
# materiali/ (assets/ non e' versionato, sono file derivati) e export web fatto
# da tools/esporta_web.sh, lo stesso script che si usa in locale - cosi' non
# esistono due ricette che possono divergere.
#
# Perche' funzioni serve una impostazione, una volta sola:
#   Settings -> Pages -> Source: GitHub Actions
name: Pagina giocabile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta, e non si annulla quella in corso: meglio una
# coda breve che una pagina lasciata a meta'.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT: "4.7"

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot
        run: |
          curl -sSLf -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      # Il pacchetto dei template pesa 1,3 GB e a noi ne servono 20 MB: una
      # volta estratti si tengono in cache, cosi' le build successive non lo
      # riscaricano. Se la cache manca, ci pensa esporta_web.sh.
      - name: Template web dalla cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-web-templates-${{ env.GODOT }}-stable

      - name: Grafica dai PDF
        run: |
          pip install --quiet pymupdf
          python3 tools/estrai_grafica.py

      - name: Export web
        run: tools/esporta_web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
